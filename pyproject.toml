[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coin-agents"
version = "0.1.0"
description = "Bithumb market data and isolated paper-trading wallets"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
coin = "coin.cli:main"

[tool.setuptools.packages.find]
include = ["coin*"]
